<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🥕</div>
      <h2>Carrot AI Gateway</h2>
      <p class="auth-subtitle">{{ isLoginMode ? 'Welcome back! Sign in to continue' : 'Create an account to manage your sessions' }}</p>
    </div>

    <div class="auth-tabs">
      <button [class.active]="isLoginMode" (click)="isLoginMode = true; errorMessage = ''">Sign In</button>
      <button [class.active]="!isLoginMode" (click)="isLoginMode = false; errorMessage = ''">Register</button>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="!isLoginMode" class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="name@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input-wrapper">
          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="••••••••" required />
          <button type="button" class="toggle-password-btn" (click)="toggleShowPassword()" [title]="showPassword ? 'Hide Password' : 'Show Password'">
            <!-- Eye Open Icon (Click to show password) -->
            <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <!-- Eye Off / Slashed Icon (Click to hide password) -->
            <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ isLoginMode ? 'Sign In' : 'Create Account' }}</span>
        <span *ngIf="isLoading">Connecting...</span>
      </button>
    </form>

    <div class="auth-footer">
      <span *ngIf="isLoginMode">Don't have an account? <a (click)="toggleMode()">Register</a></span>
      <span *ngIf="!isLoginMode">Already have an account? <a (click)="toggleMode()">Sign In</a></span>
    </div>
  </div>
</div>
