<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">🥕</div>
      <h2>Carrot AI Gateway</h2>
      <p class="auth-subtitle">{{ isLoginMode ? 'Welcome back! Sign in to continue' : 'Create an account to manage your sessions' }}</p>
    </div>

    <div class="auth-tabs">
      <button [class.active]="isLoginMode" (click)="isLoginMode = true; errorMessage = ''">Sign In</button>
      <button [class.active]="!isLoginMode" (click)="isLoginMode = false; errorMessage = ''">Register</button>
    </div>

    <div *ngIf="errorMessage" class="error-banner">
      ⚠️ {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="!isLoginMode" class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="name" name="name" placeholder="John Doe" required />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="name@example.com" required />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">{{ isLoginMode ? 'Sign In' : 'Create Account' }}</span>
        <span *ngIf="isLoading">Connecting...</span>
      </button>
    </form>

    <div class="auth-footer">
      <span *ngIf="isLoginMode">Don't have an account? <a (click)="toggleMode()">Register</a></span>
      <span *ngIf="!isLoginMode">Already have an account? <a (click)="toggleMode()">Sign In</a></span>
    </div>
  </div>
</div>
